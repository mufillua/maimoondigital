<div class="dock">
  @if (mode() === 'home') {
    <a class="pill pill--home" href="?work=open" (click)="open($event)">
      <span class="pill__text">Explore our work</span>
      <span class="pill__btn" aria-hidden="true">
        <svg viewBox="0 0 12 12" focusable="false"><path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
    </a>
  } @else {
    <div class="pill pill--work">
      <span class="pill__icon" aria-hidden="true">
        @for (k of [kind()]; track k) {
        <span class="pill__swap">
        @switch (k) {
          @case ('mobile') {
            <svg viewBox="0 0 16 16" focusable="false"><rect x="4.5" y="1.5" width="7" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 12.2h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          }
          @case ('catalogue') {
            <svg viewBox="0 0 16 16" focusable="false"><rect x="2" y="2" width="5" height="5" rx="1.3" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1.3" fill="currentColor" opacity=".55"/><rect x="2" y="9" width="5" height="5" rx="1.3" fill="currentColor" opacity=".55"/><rect x="9" y="9" width="5" height="5" rx="1.3" fill="currentColor"/></svg>
          }
          @default {
            <svg viewBox="0 0 16 16" focusable="false"><rect x="1.75" y="2.5" width="12.5" height="11" rx="2.2" fill="currentColor"/><rect x="1.75" y="5.5" width="12.5" height="1.3" fill="#3a3a3a"/></svg>
          }
        }
        </span>
        }
      </span>
      <span class="pill__label" aria-live="polite">
        @for (l of [label()]; track l) {
          <span class="pill__text pill__swap">{{ l }}</span>
        }
      </span>
      <button type="button" class="pill__close" (click)="close()" aria-label="Close work and return home">
        <svg viewBox="0 0 12 12" focusable="false"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  }
</div>
