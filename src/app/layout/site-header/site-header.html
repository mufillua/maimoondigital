<header class="header">
  <a class="brand" href="/" (click)="toTop($event)" [attr.aria-label]="site.name + ', back to top'">
    <app-brand-mark [intro]="true" />
    <span class="brand__word" aria-hidden="true">@for (ch of letters; track $index) {<span class="ch" [style.--i]="$index">{{ ch }}</span>}</span>
  </a>

  <nav class="nav" aria-label="Main">
    <ul class="nav__pill">
      @for (item of nav; track item.label; let first = $first) {
        <li>
          <a [href]="href(item)" (click)="go($event, item)" [class.is-primary]="first">{{ item.label }}</a>
        </li>
      }
    </ul>

    <div class="nav__compact">
      <button type="button" class="nav__toggle" [attr.aria-expanded]="menuOpen()" aria-controls="compact-menu"
              (click)="menuOpen.set(!menuOpen())">
        Menu
        <span class="nav__chev" aria-hidden="true"></span>
      </button>
      <ul id="compact-menu" class="nav__menu" [class.is-open]="menuOpen()">
        @for (item of nav; track item.label) {
          <li><a [href]="href(item)" (click)="go($event, item)" [attr.tabindex]="menuOpen() ? null : -1">{{ item.label }}</a></li>
        }
      </ul>
    </div>
  </nav>
</header>

<!-- Once the header has scrolled away, the logo mark (just the M) stays pinned
     at the top; hovering it slides the name out from behind the tile. -->
<a class="brand-pin" href="/" (click)="toTop($event)" [class.is-on]="pinned()"
   [attr.aria-label]="site.name + ', back to top'" [attr.aria-hidden]="pinned() ? null : 'true'" [attr.tabindex]="pinned() ? null : -1">
  <app-brand-mark />
  <span class="brand-pin__word" aria-hidden="true">{{ site.wordmark }}</span>
</a>
